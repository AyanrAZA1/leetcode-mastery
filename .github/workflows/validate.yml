name: Repository Validation

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  validate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Validate repository
        run: |
          echo "Repository structure:"
          find . -maxdepth 2 -type d | sort
          echo "Validation completed."
