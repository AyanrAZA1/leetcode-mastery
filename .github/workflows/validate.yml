name: Repository Validation

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Python syntax check
        run: |
          python3 -m compileall -q \
            10-Automation/scripts \
            scripts

      - name: Run repository audit
        run: |
          if [ -f 10-Automation/scripts/audit_repo.py ]; then
            python3 10-Automation/scripts/audit_repo.py
          fi

      - name: Run validation
        run: |
          if [ -f 10-Automation/scripts/validate_v4.py ]; then
            python3 10-Automation/scripts/validate_v4.py
          fi

      - name: Verify Git repository
        run: |
          git status --short
          git branch --show-current
