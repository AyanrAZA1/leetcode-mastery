name: LeetCode Mastery Automation

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: mastery-automation
  cancel-in-progress: true

jobs:
  mastery:
    name: Build Mastery System
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Verify repository
        run: |
          git status
          git branch --show-current

      - name: Run mastery pipeline
        run: |
          chmod +x 10-Automation/scripts/*.py 2>/dev/null || true
          chmod +x 10-Automation/scripts/*.sh
          ./10-Automation/scripts/master_pipeline.sh

      - name: Validate generated files
        run: |
          python3 10-Automation/scripts/validate_v4.py

      - name: Commit generated changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add 10-Automation 09-Statistics PROGRESS.md README.md ROADMAP.md

          if git diff --cached --quiet; then
            echo "ℹ️ No generated changes."
            exit 0
          fi

          git commit -m "chore: update mastery indexes [skip ci]"
          git push origin HEAD:main
